<body>
<h1>Secure checkout</h1>
<p>Total: <span data-next-display="cart.total" data-test-amount="1234.5"></span></p>
<div data-next-cart-summary><div class="line"><div class="price">$12.00</div></div></div>
<div class="exit" data-toggle-param="exit">Wait! Take 10% off</div>
<form data-next-checkout-step="1" data-test-validate="off">
  <input type="email" data-next-checkout-field="email" placeholder="Email">
  <input type="text" data-next-checkout-field="fname" placeholder="First name">
  <input type="text" data-next-checkout-field="lname" placeholder="Last name">
  <select data-next-checkout-field="country"><option value="US">United States</option><option value="CA">Canada</option></select>
  <input type="text" data-next-checkout-field="address1" placeholder="Address">
  <input type="text" data-next-checkout-field="city" placeholder="City">
  <select data-next-checkout-field="province"><option value="CA">California</option><option value="TX">Texas</option></select>
  <input type="text" data-next-checkout-field="postal" placeholder="ZIP">
  <input type="text" data-next-checkout-field="cc-number" placeholder="Card number">
  <select data-next-checkout-field="exp-month"><option value="12">12</option></select>
  <select data-next-checkout-field="exp-year"><option value="2030">2030</option></select>
  <input type="text" data-next-checkout-field="cvv" placeholder="CVV">
  <label class="addon"><input type="checkbox" name="shipping_protection" checked> Shipping Protection $4.99</label>
  <button type="submit">Complete purchase</button>
</form>
